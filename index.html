</style></head><body><iframe class="desktop-v3-frame" src="escritorio-v3/index.html" title="Condesa Spot — diseño original V3 de escritorio"></iframe><div class="mobile-v41-site">
<header class="header"><div class="container head"><a href="#inicio" class="brand" onclick="go('inicio')"><img src="assets/logo.png" alt="Condesa Spot"></a><nav class="nav" aria-label="Principal"><button onclick="go('inicio')">⌂ Inicio</button><button onclick="go('categorias')">▦ Categorías</button><button onclick="go('novedades')">✨ Novedades</button><button onclick="go('vendidos')">♡ Más vendidos</button><button onclick="go('contacto')">☏ Contacto</button></nav><div class="tools"><input class="search" aria-label="Buscar productos" placeholder="Buscar productos..." onkeydown="if(event.key==='Enter')go('categorias',this.value)"><button class="heart" onclick="go('favoritos')" aria-label="Favoritos">♡</button></div></div><div class="mobile-search-wrap"><label class="mobile-search-label" for="mobileSearch">Buscar productos digitales</label><div class="mobile-search-field"><span aria-hidden="true">⌕</span><input id="mobileSearch" type="search" placeholder="Buscar planners, coloreables, plantillas..." onkeydown="if(event.key==='Enter')go('categorias',this.value)"></div></div><div class="mobile-nav-panel"><button onclick="go('inicio')">Inicio</button><button onclick="go('categorias')">Categorías</button><button onclick="go('novedades')">Novedades</button><button onclick="go('vendidos')">Más vendidos</button><button onclick="go('contacto')">Contacto</button></div></header>
<main><div class="home" id="home"><div class="hero"><img class="hero-desktop" src="assets/hero-desktop.png" alt="Condesa Spot, productos digitales con Capi y Michi"><div class="hero-mobile"><img class="mobile-text" src="assets/hero-text.png" alt="Productos digitales que organizan, inspiran y te hacen la vida más bonita"><img class="mobile-brand" src="assets/hero-brand.png" alt="Condesa Spot Tienda Digital"><img class="mobile-mascots" src="assets/hero-mascots.png" alt="Capi y Michi con su computadora"></div></div><section class="section container" id="category-section"><h2 class="section-title">Explora por categoría</h2><div class="categories" id="homeCats"></div></section><section class="section container"><div class="heading-row"><h2 class="section-title">Más vendidos</h2><a class="all" href="#vendidos" onclick="go('vendidos');return false">Ver todos →</a></div><div class="products" id="homeProducts"></div></section><div class="benefits"><img src="assets/benefits.png" alt="100% digital, imprime o usa digital, diseños originales y compra segura"></div></div><section class="page container" id="page"><div class="banner"><h1 id="pageTitle"></h1><p id="pageIntro"></p></div><div id="pageTools"></div><div class="list-products" id="pageProducts"></div></section></main>
<footer class="footer">♡ Condesa Spot · Tienda digital · Prototipo responsive, precios e imágenes provisionales ♡</footer><nav class="mobile-bottom" aria-label="Navegación móvil"><button data-tab="inicio" onclick="go('inicio')"><span class="tab-icon">⌂</span><span>Inicio</span></button><button data-tab="categorias" onclick="go('categorias')"><span class="tab-icon">▦</span><span>Categorías</span></button><button data-tab="novedades" onclick="go('novedades')"><span class="tab-icon">✦</span><span>Novedades</span></button><button data-tab="favoritos" onclick="go('favoritos')"><span class="tab-icon">♡</span><span>Favoritos</span></button><button data-tab="mas" onclick="toggleMore()" aria-expanded="false" aria-controls="morePanel"><span class="tab-icon">☰</span><span>Más</span></button></nav><div class="more-scrim" id="moreScrim" onclick="toggleMore(false)"></div><aside class="more-panel" id="morePanel" aria-label="Más opciones"><div class="more-title"><strong>Más opciones ♡</strong><button onclick="toggleMore(false)" aria-label="Cerrar menú">✕</button></div><button onclick="go('vendidos')">♡ Más vendidos <span>›</span></button><button onclick="go('contacto')">✉ Contacto <span>›</span></button><button onclick="go('categorias')">⌕ Buscar en catálogo <span>›</span></button></aside><div class="overlay" id="overlay" onclick="if(event.target===this)closeDetail()"><div class="dialog" role="dialog" aria-modal="true"><div class="dialog-top"><h2 id="detailTitle"></h2><button class="close" onclick="closeDetail()" aria-label="Cerrar">×</button></div><div id="detailBody"></div></div></div><script src="config.js"></script><script>
let products=[],favorites=new Set(JSON.parse(localStorage.getItem('condesa-favs')||'[]')),currentCategory='Todos',currentQuery='';const catNames=['Productividad','Colorear','Finanzas','Plantillas','Educación','Eventos','Arte e Imprimibles'];const catImages=['productividad','colorear','finanzas','plantillas','educacion','eventos','arte'];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'$'+Number(n||0).toLocaleString('es-MX')+' MXN';const img=p=>p.imagen||'assets/'+(p.id==='redes'?'redes':p.id)+'.png';
function card(p){return `<article class="product"><img class="product-img" src="${esc(img(p))}" alt="${esc(p.nombre)}" loading="lazy" onclick="detail('${esc(p.id)}')"><h3 onclick="detail('${esc(p.id)}')">${esc(p.nombre)}</h3><p>${esc(p.descripcion)}</p><div class="product-foot"><span class="price">${money(p.precio)}</span><button class="action" onclick="detail('${esc(p.id)}')">Ver producto ♡</button></div><button class="more" onclick="detail('${esc(p.id)}')">Descubrir más →</button></article>`}
function home(){document.getElementById('homeCats').innerHTML=catNames.map((c,i)=>`<button class="cat" onclick="go('categorias','', '${c}')" aria-label="Ver ${c}"><img src="assets/${catImages[i]}.png" alt="${c}"></button>`).join('');document.getElementById('homeProducts').innerHTML=products.slice(0,4).map(card).join('')}
function go(page='inicio',q='',category='Todos'){toggleMore(false);closeDetail();document.querySelector('.mobile-nav-panel').classList.remove('open');document.getElementById('home').classList.toggle('hidden',page!=='inicio');document.getElementById('page').classList.toggle('active',page!=='inicio');currentCategory=category;currentQuery=q;location.hash=page;document.querySelectorAll('.mobile-bottom button').forEach(b=>{let active=b.dataset.tab===page;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});if(page==='inicio'){window.scrollTo(0,0);return}const titles={categorias:'Explora por categoría ♡',novedades:'✨ Novedades',vendidos:'♡ Más vendidos',favoritos:'♡ Mis favoritos',contacto:'♡ Contacto'};const intros={categorias:'Descubre nuestros productos digitales.',novedades:'Lo nuevo en nuestro universo Kawaii.',vendidos:'Selección destacada de demostración, no un ranking real de ventas.',favoritos:'Tus productos guardados en este dispositivo.',contacto:'Pronto podrás contactarnos por WhatsApp.'};document.getElementById('pageTitle').textContent=titles[page]||'Condesa Spot';document.getElementById('pageIntro').textContent=intros[page]||'';renderPage(page);window.scrollTo(0,0)}
function toggleMore(force){const panel=document.getElementById('morePanel'),scrim=document.getElementById('moreScrim');const open=typeof force==='boolean'?force:!panel.classList.contains('open');panel.classList.toggle('open',open);scrim.classList.toggle('open',open);const btn=document.querySelector('[data-tab=mas]');btn.setAttribute('aria-expanded',String(open));btn.classList.toggle('active',open)}
function filterCatalog(){const list=products.filter(p=>(currentCategory==='Todos'||p.categoria===currentCategory)&&`${p.nombre} ${p.descripcion} ${p.categoria}`.toLowerCase().includes(currentQuery.toLowerCase()));document.getElementById('pageProducts').innerHTML=list.map(card).join('')||'<p class="empty">No encontramos productos. Prueba otra búsqueda ♡</p>'}
function renderPage(page){let list=[...products],tools='';if(page==='categorias'){list=list.filter(p=>(currentCategory==='Todos'||p.categoria===currentCategory)&&`${p.nombre} ${p.descripcion} ${p.categoria}`.toLowerCase().includes(currentQuery.toLowerCase()));tools=`<input class="page-search" aria-label="Buscar en catálogo" placeholder="Buscar productos..." value="${esc(currentQuery)}" oninput="currentQuery=this.value;filterCatalog()"><div class="filter-row">${['Todos',...catNames].map(c=>`<button class="${currentCategory===c?'selected':''}" onclick="currentCategory='${c}';renderPage('categorias')">${c}</button>`).join('')}</div>`}else if(page==='novedades'){list=list.filter(p=>p.novedad).sort((a,b)=>String(b.fechaPublicacion||'').localeCompare(String(a.fechaPublicacion||'')))}else if(page==='vendidos'){list=list.filter(p=>p.masVendido)}else if(page==='favoritos'){list=list.filter(p=>favorites.has(p.id))}else if(page==='contacto'){list=[];tools='<p style="text-align:center">El número de WhatsApp está pendiente de configurar en <code>config.js</code>.</p>'}document.getElementById('pageTools').innerHTML=tools;document.getElementById('pageProducts').innerHTML=list.map(card).join('')||(page==='contacto'?'':'<p class="empty">Por ahora no hay productos en esta sección ♡</p>')}
function detail(id){const p=products.find(x=>x.id===id);if(!p)return;const wa=(window.CONDESA_CONFIG?.whatsapp||'').replace(/\D/g,'');const waUrl=wa?'https://wa.me/'+wa+'?text='+encodeURIComponent('Hola, me interesa '+p.nombre+' de Condesa Spot'):'';const btn=(label,url,klass='')=>url?`<a class="${klass}" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`:`<button class="${klass}" disabled>${label} · pendiente</button>`;document.getElementById('detailTitle').textContent=p.nombre;document.getElementById('detailBody').innerHTML=`<img class="dialog-img" src="${esc(img(p))}" alt="${esc(p.nombre)}"><p><strong>${money(p.precio)}</strong> · ${esc(p.categoria)}</p><p>${esc(p.detalle||p.descripcion)}</p><p>Formato: ${esc(p.formato||'Digital')}</p><button class="action" onclick="toggleFav('${esc(p.id)}')">${favorites.has(p.id)?'♥ Quitar de favoritos':'♡ Guardar en favoritos'}</button><div class="detail-actions">${btn('Descubrir más',p.landing)}${btn('Comprar ahora',p.pago,'purple')}${btn('Consultar por WhatsApp',waUrl,'green')}</div><p class="note">Prototipo: enlaces de compra y WhatsApp pendientes de configurar.</p>`;document.getElementById('overlay').classList.add('open');document.body.style.overflow='hidden'}
function toggleFav(id){favorites.has(id)?favorites.delete(id):favorites.add(id);localStorage.setItem('condesa-favs',JSON.stringify([...favorites]));detail(id)}function closeDetail(){document.getElementById('overlay').classList.remove('open');document.body.style.overflow=''}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});fetch('catalogo.json').then(r=>r.json()).then(data=>{products=data;home();const page=location.hash.slice(1);if(page&&page!=='inicio')go(page)}).catch(()=>{document.getElementById('homeProducts').innerHTML='<p>No se pudo cargar el catálogo. Abre el prototipo mediante un servidor local.</p>'});
</script></div></body></html>
