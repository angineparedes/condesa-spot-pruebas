<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f9d9ee"><title>Condesa Spot ♡ Tienda Digital</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff8fc;color:#431c50;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:1536px;margin:auto;position:relative}.art{width:100%;display:block}.hit{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:18px}.hit:focus-visible{outline:4px solid #f34e99;background:#ff7ab333}.hit:hover{background:#fff5;box-shadow:inset 0 0 0 2px #f96ca1}.screenreader{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.shade{position:fixed;inset:0;background:#321435a8;z-index:20;display:none;align-items:center;justify-content:center;padding:16px}.shade.open{display:flex}.panel{background:#fffafd;border:3px solid #f6b8d9;border-radius:27px;width:min(760px,100%);max-height:90vh;overflow:auto;padding:22px;box-shadow:0 25px 65px #32143555}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top h2{margin:0;font-size:clamp(24px,4vw,34px)}.close{border:0;background:#fce1ef;color:#632354;border-radius:50%;width:38px;height:38px;font-size:24px;cursor:pointer}.pill{background:#ffe1ef;border-radius:999px;padding:5px 12px;display:inline-block;font-size:13px;font-weight:700}.price{font-size:26px;color:#c4387d;font-weight:850}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.btn{background:#f75599;color:white;border:0;border-radius:999px;padding:12px 17px;font-weight:750;cursor:pointer;text-decoration:none;display:inline-block}.btn.secondary{background:#8750b5}.btn.green{background:#b2efd3;color:#245b48}.btn:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:16px}.tile{background:#fff;border:2px solid #f5d5e6;border-radius:18px;padding:15px;cursor:pointer;text-align:left;color:#4d2052}.tile:hover{transform:translateY(-2px);box-shadow:0 8px 20px #edb1d655}.tile strong{display:block;margin:5px 0}.muted{color:#795e7c}.search{border:2px solid #e6b2dd;border-radius:999px;padding:13px;width:100%;font:inherit}.category{margin:4px;padding:9px 12px;border-radius:99px;border:1px solid #eab7d7;background:#fbe9f5;cursor:pointer}.category.active{background:#f75599;color:#fff}.preview{border-radius:15px;overflow:hidden;background:#f9e3f0;position:relative;height:220px}.preview img{width:100%;height:100%;object-fit:cover;object-position:center}.note{font-size:13px;color:#8a6280}.favorite{font-size:25px;color:#e94790}.collection-hero{border-radius:24px;padding:26px 20px;text-align:center;background:linear-gradient(115deg,#ffe0f1,#e9dcff);margin:16px 0}.collection-hero.popular{background:linear-gradient(115deg,#ffe4ed,#fff0cb)}.collection-hero h3{font-size:clamp(22px,4vw,30px);margin:8px 0;color:#702c68}.collection-hero p{margin:7px;color:#755175}.collection-sparkle{font-size:35px;color:#f05296}.mobile-nav{display:none}@media(max-width:680px){.wrap{min-width:0}.panel{padding:17px}.mobile-nav{display:flex;position:sticky;bottom:0;background:#fff9fddd;backdrop-filter:blur(8px);z-index:3;justify-content:space-around;padding:9px}.mobile-nav button{background:#fce4f0;border:0;border-radius:15px;padding:10px;color:#632354;font-weight:bold}.hit{border-radius:5px}}
</style></head><body>
<div class="wrap" id="main"><img class="art" src="../assets/diseno-aprobado.png" alt="Diseño original aprobado de Condesa Spot, con capibara, gatita, categorías y productos digitales" id="design"><div id="hotspots"></div></div>
<nav class="mobile-nav"><button onclick="openCatalog('Todos')">☷ Categorías</button><button onclick="openCatalog('Todos')">⌕ Buscar</button><button onclick="openFavorites()">♡ Favoritos</button></nav>
<div class="shade" id="shade" role="dialog" aria-modal="true" aria-label="Navegación Condesa Spot" onclick="if(event.target===this)closePanel()"><section class="panel"><div class="top"><h2 id="panelTitle">Condesa Spot ♡</h2><button class="close" aria-label="Cerrar" onclick="closePanel()">×</button></div><div id="panelBody"></div></section></div>
<script src="../config.js"></script><script>
let products=[],favorites=new Set(),currentCategory='Todos';const cats=['Todos','Productividad','Colorear','Finanzas','Plantillas','Educación','Eventos','Arte e Imprimibles'];
const fallback=[{id:'planner',nombre:'Planner Diario de 30 Días',categoria:'Productividad',precio:129,descripcion:'Organiza tus metas, tareas y hábitos.'},{id:'capi',nombre:'Capi Café — Libro para colorear',categoria:'Colorear',precio:149,descripcion:'25 escenas adorables y con mucho humor.'},{id:'presupuesto',nombre:'Mi Presupuesto Bonito',categoria:'Finanzas',precio:89,descripcion:'Controla tus ingresos, gastos y ahorros.'},{id:'redes',nombre:'Kit de Plantillas para Redes',categoria:'Plantillas',precio:119,descripcion:'Diseños editables para tu negocio.'}];
fetch('../catalogo.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>products=d).catch(()=>products=fallback);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(title,html){document.getElementById('panelTitle').textContent=title;document.getElementById('panelBody').innerHTML=html;document.getElementById('shade').classList.add('open');document.body.style.overflow='hidden'}
function closePanel(){document.getElementById('shade').classList.remove('open');document.body.style.overflow=''}
function openCatalog(category='Todos'){currentCategory=category;renderCatalog('')}
function renderCatalog(q=''){const items=products.filter(p=>(currentCategory==='Todos'||p.categoria===currentCategory)&&(`${p.nombre} ${p.descripcion} ${p.categoria}`).toLowerCase().includes(q.toLowerCase()));const nav=cats.map(c=>`<button class="category ${currentCategory===c?'active':''}" onclick="openCatalog('${c}')">${c}</button>`).join('');const tiles=items.map(p=>`<button class="tile" onclick="openProduct('${esc(p.id)}')"><span class="pill">${esc(p.categoria)}</span><strong>${esc(p.nombre)}</strong><small>${esc(p.descripcion)}</small><p class="price">$${Number(p.precio).toLocaleString('es-MX')} MXN</p>Ver producto →</button>`).join('');show('Explora por categoría ♡',`<p class="muted">Elige tus cositas digitales favoritas.</p><input class="search" id="catalogSearch" placeholder="Buscar productos..." value="${esc(q)}" oninput="updateSearch(this.value)"><div style="margin:13px 0">${nav}</div><div id="catalogTiles" class="grid">${tiles||'<p>Próximamente encontrarás productos aquí ♡</p>'}</div>`)}
function updateSearch(q){const items=products.filter(p=>(currentCategory==='Todos'||p.categoria===currentCategory)&&(`${p.nombre} ${p.descripcion} ${p.categoria}`).toLowerCase().includes(q.toLowerCase()));document.getElementById('catalogTiles').innerHTML=items.map(p=>`<button class="tile" onclick="openProduct('${esc(p.id)}')"><span class="pill">${esc(p.categoria)}</span><strong>${esc(p.nombre)}</strong><p class="price">$${p.precio} MXN</p>Ver producto →</button>`).join('')||'<p>Sin resultados ♡</p>'}
function openCollection(kind){
 const latest=kind==='new';
 const list=products.filter(p=>latest?p.novedad===true:p.masVendido===true).sort((a,b)=>latest?String(b.fechaPublicacion||'').localeCompare(String(a.fechaPublicacion||'')):(Number(b.ventas||0)-Number(a.ventas||0)));
 const heading=latest?'✨ Novedades':'🔥 Más vendidos';
 const intro=latest?'Recién llegados a nuestro universo digital ♡':'Los favoritos de nuestra comunidad ♡';
 const label=latest?'Nuevo':'Favorito de la tienda';
 const tiles=list.map((p,i)=>`<button class="tile" onclick="openProduct('${esc(p.id)}')"><span class="pill">${latest?'✨ Nuevo':`♡ Destacado ${i+1}`}</span><strong>${esc(p.nombre)}</strong><small>${esc(p.descripcion)}</small><p class="price">$${Number(p.precio).toLocaleString('es-MX')} MXN</p><span>Descubrir producto →</span></button>`).join('');
 show(heading,`<div class="collection-hero ${latest?'new':'popular'}"><div class="collection-sparkle">${latest?'✧ ♡ ✦':'♡ ★ ♡'}</div><h3>${intro}</h3><p>${latest?'Explora los últimos productos que hemos agregado.':'Selección destacada de demostración; aún no representa un ranking real de ventas.'}</p></div><div class="grid">${tiles||'<p>Muy pronto habrá novedades aquí ♡</p>'}</div><p class="note">Productos y precios provisionales.</p><button class="category" onclick="openCatalog('Todos')">Ver catálogo completo →</button>`);
}
function openProduct(id){const p=products.find(x=>x.id===id);if(!p)return;const n=(window.CONDESA_CONFIG?.whatsapp||'').replace(/\D/g,'');const wa=n?`https://wa.me/${n}?text=${encodeURIComponent('Hola, me interesa '+p.nombre+' de Condesa Spot.')}`:'';const button=(label,url,klass)=>url?`<a class="btn ${klass}" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`:`<button class="btn ${klass}" disabled title="Enlace pendiente de configurar">${label} · pendiente</button>`;const idx=products.findIndex(x=>x.id===id);const crop=[['3%','58%'],['28%','58%'],['53%','58%'],['78%','58%']][idx]||['50%','50%'];const image=p.imagen?`<img src="${esc(p.imagen)}" alt="${esc(p.nombre)}">`:`<div style="height:100%;background-image:url('../assets/diseno-aprobado.png');background-size:400% auto;background-position:${crop[0]} ${crop[1]}"></div>`;show(p.nombre,`<p><span class="pill">${esc(p.categoria)}</span> <button class="category" onclick="toggleFavorite('${esc(p.id)}')">${favorites.has(p.id)?'♥ Guardado':'♡ Favorito'}</button></p><div class="preview">${image}</div><p class="price">$${Number(p.precio).toLocaleString('es-MX')} MXN</p><p>${esc(p.detalle||p.descripcion)}</p><p class="muted">Formato: ${esc(p.formato||'Digital')}</p><div class="actions">${button('✦ Descubrir más',p.landing,'')}${button('🛍 Comprar ahora',p.pago,'secondary')}${button('☏ Consultar por WhatsApp',wa,'green')}</div><p class="note">Prototipo: precios e imágenes provisionales. Configura enlaces en catalogo.json y número en config.js.</p><button class="category" onclick="openCatalog('Todos')">← Volver al catálogo</button>`)}
function toggleFavorite(id){favorites.has(id)?favorites.delete(id):favorites.add(id);openProduct(id)}
function openFavorites(){show('Mis favoritos ♡',favorites.size?`<div class="grid">${products.filter(p=>favorites.has(p.id)).map(p=>`<button class="tile" onclick="openProduct('${esc(p.id)}')">${esc(p.nombre)}<p class="price">$${p.precio} MXN</p></button>`).join('')}</div>`:'<p>Aún no tienes favoritos. Explora el catálogo y toca ♡.</p>')}
function contact(){show('Contacto ♡','<p>Próximamente podrás contactarnos directamente por WhatsApp. El número se configura en <code>config.js</code>.</p>')}
function addHit(x,y,w,h,fn,label){const b=document.createElement('button');b.className='hit';b.style.cssText=`left:${x/1536*100}%;top:${y/1024*100}%;width:${w/1536*100}%;height:${h/1024*100}%`;b.title=label;b.setAttribute('aria-label',label);b.onclick=fn;document.getElementById('hotspots').appendChild(b)}
addHit(367,10,112,48,()=>closePanel(),'Inicio');addHit(490,9,155,48,()=>openCatalog(),'Categorías');addHit(652,9,160,48,()=>openCollection('new'),'Novedades');addHit(813,9,160,48,()=>openCollection('best'),'Más vendidos');addHit(975,9,130,48,contact,'Contacto');addHit(1137,10,263,49,()=>openCatalog(),'Buscar productos');addHit(1415,10,65,49,openFavorites,'Favoritos');
[['Productividad',132],['Colorear',336],['Finanzas',519],['Plantillas',701],['Educación',877],['Eventos',1055],['Arte e Imprimibles',1234]].forEach(([c,x])=>addHit(x,392,170,119,()=>openCatalog(c),'Categoría '+c));
[['planner',42],['capi',409],['presupuesto',774],['redes',1139]].forEach(([id,x])=>{addHit(x,584,350,276,()=>openProduct(id),'Ver '+id);addHit(x+140,860,210,40,()=>openProduct(id),'Consultar '+id)});addHit(1360,541,145,39,()=>openCatalog(),'Ver todos');
window.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});
</script></body></html>
